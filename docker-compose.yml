name: chatapp

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:-chatapp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_DATABASE_NAME:-chatapp}
    ports:
      - "${DB_BIND_ADDRESS:-127.0.0.1}:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-chatapp} -d ${DB_DATABASE_NAME:-chatapp}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8.8.3-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    ports:
      - "${REDIS_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  objectstore:
    image: chrislusf/seaweedfs:4.53
    command: ["mini", "-dir=/data", "-ip.bind=0.0.0.0"]
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-localdev}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
      S3_BUCKET: ${MINIO_BUCKET:-chatapp-media}
    ports:
      - "${S3_BIND_ADDRESS:-127.0.0.1}:${S3_PORT:-8333}:8333"
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9333/healthz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    command: >-
      goose -dir /migrations postgres
      "host=database port=5432 user=$${DB_USERNAME} password=$${DB_PASSWORD} dbname=$${DB_DATABASE_NAME} sslmode=$${DB_SSL_MODE}"
      up
    environment:
      DB_USERNAME: ${DB_USERNAME:-chatapp}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_DATABASE_NAME: ${DB_DATABASE_NAME:-chatapp}
      DB_SSL_MODE: ${DB_SSL_MODE:-disable}
      DB_SSL_ROOT_CERT: ${DB_SSL_ROOT_CERT:-}
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: 8080
      DB_HOST: database
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-chatapp}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_DATABASE_NAME: ${DB_DATABASE_NAME:-chatapp}
      DB_SSL_MODE: ${DB_SSL_MODE:-disable}
      DB_SSL_ROOT_CERT: ${DB_SSL_ROOT_CERT:-}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      REDIS_DB: ${REDIS_DB:-0}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      AUTH_EXPIRY_PERIOD: ${AUTH_EXPIRY_PERIOD:-24}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081}
      STORAGE_PROVIDER: minio
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-host.docker.internal:8333}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-localdev}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-chatapp-media}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-}
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      objectstore:
        condition: service_healthy
    restart: unless-stopped

  edge:
    image: nginx:1.30.6-alpine
    profiles: ["edge"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./.certs:/etc/nginx/certs:ro
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/chatapp.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  s3data:
